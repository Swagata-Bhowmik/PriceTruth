[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "price-truth"
version = "0.1.0"
description = "Evidence-based price comparisons using real retail observations"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mutmut]
source_paths = [
    "src/price_truth/calculations.py",
    "src/price_truth/catalogue.py",
    "src/price_truth/history.py",
    "src/price_truth/observations.py",
    "src/price_truth/forecast.py",
    "src/price_truth/offers.py",
    "src/price_truth/evidence_store.py",
    "src/price_truth/price_api.py",
]
also_copy = [
    "src/price_truth/__init__.py",
    "src/price_truth/paths.py",
    "src/price_truth/external.py",
    "src/price_truth/cache.py",
    "datasets/external",
]
# Domain tests only: Streamlit AppTest and model-training tests are slow and exercise
# no additional behaviour of the mutated modules.
pytest_add_cli_args_test_selection = [
    "tests/test_calculations.py",
    "tests/test_services.py",
    "tests/test_search.py",
    "tests/test_offers.py",
    "tests/test_evidence_store.py",
    "tests/test_observations.py",
    "tests/test_forecast.py",
    "tests/test_price_api.py",
    "tests/test_review_fixes_domain.py",
]
