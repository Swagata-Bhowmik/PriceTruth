[theme]
base = "light"
primaryColor = "#7B68C8"
backgroundColor = "#FFFBF5"
secondaryBackgroundColor = "#F6F1EA"
textColor = "#3B3A48"
linkColor = "#5A46B0"
borderColor = "#ECE6DD"
showWidgetBorder = true
baseRadius = "0.9rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
headingFontWeights = [800, 700, 650, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#F8F3FC"
secondaryBackgroundColor = "#FFFFFF"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 2
